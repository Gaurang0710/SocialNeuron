{% extends 'public_base.html' %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-white text-slate-900 rounded-3xl shadow-2xl shadow-indigo-950/30 border border-white/10 p-8">
        <p class="text-xs font-bold uppercase tracking-[0.25em] text-indigo-600">New Password</p>
        <h1 class="text-3xl font-black mt-2">Reset password</h1>
        <p class="text-sm text-slate-600 mt-2">Enter the email and token from your reset email.</p>
        <form method="post" class="mt-6 space-y-4">
            {% csrf_token %}
            <div>
                <label class="text-sm font-semibold text-slate-700">Email</label>
                <input type="email" name="email" value="{{ email }}" required class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="text-sm font-semibold text-slate-700">Reset Token</label>
                <input type="text" name="token" value="{{ token }}" required class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="text-sm font-semibold text-slate-700">New Password</label>
                <input type="password" name="new_password" required minlength="8" class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="text-sm font-semibold text-slate-700">Confirm Password</label>
                <input type="password" name="confirm_password" required minlength="8" class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button class="w-full rounded-xl bg-indigo-600 text-white font-semibold py-3 hover:bg-indigo-700">Reset password</button>
        </form>
    </div>
</div>
{% endblock %}
