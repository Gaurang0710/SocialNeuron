{% extends 'base.html' %}

{% block title %}AI Trend & Topic Generator{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto; padding: 3rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
        <i class="fa-solid fa-lightbulb" style="font-size: 3rem; color: var(--accent-color); margin-bottom: 1rem;"></i>
        <h3>Generate Trending Topics</h3>
        <p style="color: var(--text-secondary); margin-top: 0.5rem;">
            Let the AI brainstorm the best possible topics for your niche and inject them instantly into your Drafts!
        </p>
    </div>
    
    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Select Niche / Category</label>
            <select name="category" style="width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-primary);">
                {% for cat in categories %}
                <option value="{{ cat }}">{{ cat }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div style="margin-bottom: 2rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Target Platform</label>
            <select name="platform" style="width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-primary);">
                <option value="LinkedIn">LinkedIn</option>
                <option value="Twitter">Twitter</option>
                <option value="Facebook">Facebook</option>
                <option value="Instagram">Instagram</option>
            </select>
        </div>
        
        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; font-size: 1.1rem; padding: 1rem;">
            <i class="fa-solid fa-bolt"></i> Discover Trends & Create Drafts
        </button>
    </form>
</div>
{% endblock %}
